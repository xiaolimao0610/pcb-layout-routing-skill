<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="PCB 布局布线辅助 Skill：嘉立创 EDA 专业版的 AI 原理图重排与 PCB 布局布线工具包">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1d22"/>
      <stop offset="1" stop-color="#132f36"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d3b42" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1d22" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0c1d22" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0c1d22" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>

  <!-- 右侧走线示意：禁布区 + 绕障铜线 -->
  <g transform="translate(760 40)">
    <rect x="0" y="0" width="470" height="260" rx="10" fill="#0e2328" stroke="#2a4d55"/>
    <g fill="#2e4a50" opacity="0.9">
      <rect x="90" y="0" width="16" height="170"/>
      <rect x="90" y="200" width="16" height="60"/>
      <rect x="200" y="0" width="16" height="80"/>
      <rect x="200" y="118" width="16" height="142"/>
      <rect x="310" y="0" width="16" height="140"/>
      <rect x="310" y="168" width="16" height="92"/>
    </g>
    <!-- 主走线 -->
    <g fill="none" stroke="#5fe0b0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M30 150 H70 L98 185 H160 L208 94 H250 L300 154 H340 L370 120 H440"/>
    </g>
    <g fill="#f2c46d">
      <rect x="20" y="140" width="20" height="20" rx="3"/>
      <rect x="430" y="110" width="20" height="20" rx="3"/>
    </g>
    <text x="16" y="28" fill="#7fa3a8" font-size="14" font-family="Consolas, 'JetBrains Mono', monospace">L1 · ROUTING DEMO</text>
  </g>

  <rect width="900" height="340" rx="18" fill="url(#fade)"/>

  <!-- 左侧文字 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
    <rect x="64" y="64" width="44" height="5" rx="2" fill="#f2c46d"/>
    <text x="64" y="104" fill="#8fb2b6" font-size="20">嘉立创 EDA 专业版 · AI 工具包</text>
    <text x="64" y="168" fill="#f3f1e8" font-size="52" font-weight="700">PCB 布局布线辅助 Skill</text>
    <text x="64" y="214" fill="#c9d8d9" font-size="22">原理图功能分块 → 本地布局布线 → 写回工程逐项核对</text>
    <g font-size="16" fill="#0c1d22" font-weight="600">
      <rect x="64" y="248" width="116" height="34" rx="17" fill="#5fe0b0"/>
      <text x="122" y="270" text-anchor="middle">原理图重排</text>
      <rect x="192" y="248" width="116" height="34" rx="17" fill="#5fe0b0"/>
      <text x="250" y="270" text-anchor="middle">多层布线</text>
      <rect x="320" y="248" width="116" height="34" rx="17" fill="#5fe0b0"/>
      <text x="378" y="270" text-anchor="middle">铺铜补地</text>
      <rect x="448" y="248" width="132" height="34" rx="17" fill="#f2c46d"/>
      <text x="514" y="270" text-anchor="middle">DRC 与网表核对</text>
    </g>
  </g>
</svg>
